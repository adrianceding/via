# Via 服务端示例。当前有效配置可与同机运行的客户端直接配合使用。
# Via server example. The active settings work with a client running on the same host.
# 示例密钥仅用于本机试用；公网部署前必须替换，并与客户端保持一致。
# The example key is for local testing only. Replace it before deployment and use the same key on the client.

# ==================== 必填配置 / Required ====================

# 第一版只支持 tcp。默认接受来自所有 IPv4 地址的客户端连接。
# Via v1 supports tcp only. By default, it accepts client connections on all IPv4 addresses.
transport:
  type: tcp
  listen: "0.0.0.0:38473"
  # 可选：TCP socket 写缓冲，默认 128 KiB，范围为 65512 到 16 MiB。
  # Optional: TCP socket write buffer; default 128 KiB, range 65512 to 16 MiB.
  # write_buffer_bytes: 4194304
  # Optional: per-session output queue. Defaults: 256 frames / 1 MiB / 16 control frames / 16 KiB.
  # output_queue_frames: 512
  # output_queue_bytes: 4194304
  # control_reserve_frames: 32
  # control_reserve_bytes: 32768

# 生成新密钥：openssl rand -base64 32
# Generate a new key with: openssl rand -base64 32
# 至少配置一个客户端身份。生成后把同一个 psk 填入对应客户端。
# Configure at least one client identity, then use the same psk in that client configuration.
# 可继续追加 id 和 psk 均唯一的条目。
# Additional entries must have unique id and psk values.
principals:
  - id: client-01
    psk: "MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="
#  - id: client-02
#    psk: "QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="

# ================= 可选配置 / Optional =================

# 启用内嵌只读观测界面和 JSON 接口。
# Enable the embedded read-only Manager and JSON API.
# status:
#   enabled: true
#   listen: "127.0.0.1:9091"
#   basic_auth:              # 可选；保护页面、静态资源、JSON 接口和健康检查 / Optional; protects the page, assets, JSON API, and health endpoint
#     username: "observer"
#     password: "replace-with-a-strong-password"

# 可选：所有数量字段省略或设为 0 时使用安全默认值；不能关闭内部硬上限。
# Omitting a count or setting it to 0 uses a safe default; internal hard limits cannot be disabled.
# memory_budget_bytes 为 0 时不启用配置内存预算。
# Setting memory_budget_bytes to 0 disables the configured memory budget.
# limits:
#   flows: 0                       # 所有客户端合计的逻辑数据流总数 / Total logical flows across all clients
#   per_principal_flows: 0         # 单个客户端身份的数据流数，不得大于 flows / Flows for one client identity; cannot exceed flows
#   opening_flows: 0               # 正在建立的数据流数，不得大于 flows / Flows being opened; cannot exceed flows
#   recovering_flows: 0            # 所有线路中断后正在恢复的数据流数，不得大于 flows / Flows recovering after all paths fail; cannot exceed flows
#   transport_connections: 0                 # 所有客户端合计的传输连接数 / Transport connections across all clients
#   transport_connections_per_principal: 0   # 单个客户端身份的传输连接数，不得大于 transport_connections / Transport connections for one identity; cannot exceed transport_connections
#   transport_auth_in_progress: 0            # 同时进行传输连接认证的数量，不得大于 transport_connections / Concurrent transport authentications; cannot exceed transport_connections
#   target_dials: 0                # 同时连接目标网站的数量，不得大于 opening_flows / Concurrent target connections; cannot exceed opening_flows
#   tombstones: 0                  # 已结束数据流的短期记录总数，用于处理迟到或重复消息 / Short-lived records for closed flows, used for late or duplicate messages
#   tombstones_per_principal: 0    # 单个客户端身份的结束记录数，不得大于 tombstones / Closed-flow records for one identity; cannot exceed tombstones
#   rate_limit_keys: 0             # 速率限制器同时保存的客户端或数据流状态数 / Client or flow states retained by rate limiters
#   open_rate_per_minute_per_principal: 1000 # 单个身份每分钟持续允许的 OPEN；范围 1..60000 / Sustained OPEN rate per identity per minute; range 1..60000
#   open_burst_per_principal: 256           # 单个身份的瞬时 OPEN；默认 min(opening_flows, 256) / Immediate OPEN burst per identity; defaults to min(opening_flows, 256)
#   open_rate_per_minute_global: 10000      # 所有身份每分钟持续允许的 OPEN，不得小于单身份值 / Sustained global OPEN rate per minute; cannot be below the per-identity rate
#   open_burst_global: 512                  # 所有身份的瞬时 OPEN；默认 opening_flows，且不得小于单身份值 / Immediate global OPEN burst; defaults to opening_flows and cannot be below the per-identity burst
#   flow_send_window_bytes: 4194304    # 每个 Flow 的发送窗口，默认 320 KiB，范围 65512 到 4 MiB / Per-flow send window; default 320 KiB, range 65512 to 4 MiB
#   flow_receive_window_bytes: 4194304 # 每个 Flow 的接收窗口，默认 320 KiB，范围 65512 到 4 MiB / Per-flow receive window; default 320 KiB, range 65512 to 4 MiB
#   memory_budget_bytes: 0         # 估算资源超过此字节数时拒绝启动；仅此字段的 0 表示不检查 / Reject startup above this estimated resource size; only this field uses 0 to disable the check

# 可选：以下均为默认值。通常无需修改。
# The values below are defaults and usually do not need to be changed.
# deadlines:
#   dial: "10s"               # 连接目标网站的最长时间 / Maximum time to connect to a target
#   frame_total: "30s"        # 读取一个传输帧的总时限 / Total time limit for reading one transport frame
#   frame_no_progress: "5s"   # 读取传输帧无进展的最长时间 / Maximum time without progress while reading a transport frame
#   drain_cleanup: "5s"       # 停止时等待数据流收敛和资源清理的时间 / Time allowed for flows to settle and resources to be cleaned up during shutdown
